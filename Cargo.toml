[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.12.1"
edition = "2024"
description = "A blazing fast type checked HTML macro crate."
readme = "README.md"
repository = "https://github.com/vidhanio/hypertext"
license = "MIT"
keywords = ["html", "macro", "maud", "rsx"]
categories = ["template-engine"]

[workspace.metadata.crane]
name = "hypertext"

[workspace.dependencies]
hypertext-macros = { version = "0.12.1", path = "./crates/hypertext-macros" }

html-escape = { version = "0.3", default-features = false }

[workspace.lints]
[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
